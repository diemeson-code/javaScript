<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <Ul id="mylist">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </Ul>
    <script>
        
        document.querySelector('#mylist').addEventListener('click',function(Event){
            alert('Você clicou em: ' + Event.target.innerHTML);
        });
    </script>
    
</body>
</html>

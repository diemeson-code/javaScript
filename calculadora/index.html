
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculadora">
    <div id="historico"></div>

    <input type="text" id="display" value="0" readonly>

          <!-- Primeira linha -->
    <button class="operador">C</button>
    <button class="operador">CE</button>
    <button class="operador">←</button>
    <button class="operador">%</button>

    <!-- Segunda linha -->
    <button class="especial">√</button>
    <button class="especial">x²</button>
    <button class="especial">±</button>
    <button class="operador">/</button>

    <!-- Terceira linha -->
    <button class="numero">7</button>
    <button class="numero">8</button>
    <button class="numero">9</button>
    <button class="operador">*</button>

    <!-- Quarta linha -->
    <button class="numero">4</button>
    <button class="numero">5</button>
    <button class="numero">6</button>
    <button class="operador">-</button>

    <!-- Quinta linha -->
    <button class="numero">1</button>
    <button class="numero">2</button>
    <button class="numero">3</button>
    <button class="operador">+</button>

    <!-- Sexta linha -->
    <button class="numero zero">0</button>
    <button class="numero">.</button>
    <button class="igual">=</button>
        

    </div>

    <script src="js/variaveis.js"></script>
    <script src="js/display.js"></script>
    <script src="js/historico.js">c</script>
    <script src="js/operadores.js"></script>
    <script src="js/especiais.js"></script>
    <script src="js/eventos.js"></script>
    <script src="js/teclado.js"></script>
    
</body>
</html>

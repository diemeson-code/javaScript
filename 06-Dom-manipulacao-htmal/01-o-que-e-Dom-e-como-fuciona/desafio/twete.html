<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercícios DOM</title>
</head>
<body>

    <!-- Exercício 1 -->
    <div id="myDiv">Este é um exemplo de div.</div>

    <!-- Exercício 2 -->
    <p class="highlight">Parágrafo 1</p>
    <p class="highlight">Parágrafo 2</p>

    <!-- Exercício 3 -->
    <span class="oldStyle">Texto de exemplo.</span>

    <script>

        // 1. Selecionar elemento pelo ID
        const div = document.getElementById("myDiv");
        console.log(div);
        console.log(div.textContent);

        // 2. Selecionar vários elementos com querySelectorAll
        const paragrafos = document.querySelectorAll(".highlight");
        console.log(paragrafos);

        paragrafos.forEach(paragrafo => {
            console.log(paragrafo.textContent);
        });

        // 3. Selecionar elemento com getElementsByClassName
        const texto = document.getElementsByClassName("oldStyle");
        console.log(texto);
        console.log(texto[0].textContent);

    </script>

</body>
</html>
